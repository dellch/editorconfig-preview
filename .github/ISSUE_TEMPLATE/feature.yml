name: Feature
description: A new feature or capability to implement.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should this feature do?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How do we know this feature is complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List any issues that must be completed before this one can start.
      placeholder: "Depends on #..."
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Any other relevant information, references, or constraints.
    validations:
      required: false
